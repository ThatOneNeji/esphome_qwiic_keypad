# CI fixture: mirrors ../../example.esp-idf.yaml but points external_components at the local
# checkout instead of GitHub, so CI validates the component as committed rather than the last
# published ref. Keep in sync with ../../example.esp-idf.yaml (besides `external_components:`).
esphome:
  name: qwiic-keypad-esp-idf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: ../../components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

i2c:
  - id: i2c_bus
    sda: GPIO21
    scl: GPIO22
    frequency: 100kHz
    scan: true

qwiic_keypad:
  id: keypad
  i2c_id: i2c_bus
  address: 0x4B
